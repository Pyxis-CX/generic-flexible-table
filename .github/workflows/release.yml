# Publicación en GitHub Packages con el GITHUB_TOKEN del propio workflow:
# sin secrets manuales, sin trusted publisher, sin primer publish a mano.
#
# Flujo: merge a main con changesets pendientes → este workflow abre/actualiza
# el PR "Version Packages" → al mergear ESE PR, este mismo workflow publica.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit de versiones + GitHub Release
      pull-requests: write # PR "Version Packages"
      packages: write # publicar en GitHub Packages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@pyxis-cx'

      - run: pnpm install --frozen-lockfile

      - name: Crear PR de versiones o publicar
        uses: changesets/action@v1
        with:
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
